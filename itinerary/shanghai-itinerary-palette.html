  /* day map (top of Itinerary) */
  .mapcard{border:1px solid var(--line); border-radius:14px; padding:12px; margin:0 0 18px; background:var(--surface)}

<style>:root{
    --bg:#f7f8f7; --surface:#ffffff; --surface-2:#f3f4f2; --line:#e2e5e0;
    --ink:#1c201d; --ink-soft:#5b625b; --shadow:rgba(30,34,32,.08);
    --accent:#b8402f; --accent-soft:#f8e6e1; --accent-ink:#8a3123;
    --jade:#2b6f5e; --jade-soft:#e3f0ea; --jade-ink:#1c5747;
    --amap-bg:#e3f0ea; --amap-ink:#1c5747;  
    --gold:#9c7a2e; --gold-soft:#f7edd2; --gold-ink:#7a5f22;
  }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Noto Sans SC','PingFang SC','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; display:flex; justify-content:center;}
h1,h2,h3{font-family:'Noto Serif SC','Songti SC',serif; text-wrap:balance; margin:0}
a{color:inherit}
.shell{width:100%; max-width:448px; min-height:100vh; background:var(--surface);
    box-shadow:0 0 48px var(--shadow); display:flex; flex-direction:column; position:relative;}
.head{position:sticky; top:0; z-index:5; background:var(--surface); border-bottom:1px solid var(--line);
    padding:18px 20px 0; }
.head .eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600}
.head h1{font-size:22px; font-weight:700; margin-top:4px}
.head .sub{font-size:13px; color:var(--ink-soft); margin-top:4px; padding-bottom:14px}
.daychips{display:none; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:0 20px 12px; scrollbar-width:none;}
.daychips::-webkit-scrollbar{display:none}
.daychips.show{display:flex}
.daychip{flex:0 0 auto; padding:10px 14px; min-height:38px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2);
    font:inherit; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.daychip[aria-selected="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.daychip:active{transform:scale(.96)}
.panels{flex:1; overflow-y:auto; padding:16px 20px 96px;}
.panel{display:none}
.panel.show{display:block}
.day-map{width:100%; aspect-ratio:690/360; object-fit:cover; border-radius:12px;
    margin-bottom:12px; display:block; background:var(--surface-2); border:1px solid var(--line);}
.timeline{position:relative; padding-left:22px; display:flex; flex-direction:column; gap:16px;}
.timeline::before{content:"";position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--line);}
.stop{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 13px 12px}
.stop::before{content:"";position:absolute; left:-23px; top:15px; width:10px; height:10px; border-radius:50%;
    background:var(--surface); border:2px solid var(--jade);}
.stop.optional::before{border-color:var(--gold)}
.group-head{margin-top:7px; padding:10px 13px; border:1px dashed var(--jade); border-radius:12px; background:var(--surface-2)}
.group-title{font-size:14px; font-weight:700; color:var(--jade-ink)}
.group-note{font-size:12.5px; color:var(--ink-soft); margin-top:4px}
.group-head{position:relative}
.rt-bar{position:absolute; top:10px; right:12px; margin:0}
.group-head:has(.rt-bar) .group-title{padding-right:92px}
.rt-rail{margin-top:6px}
.rt-zone{margin:8px 0 0}
.rt-zone-h{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:#8f6b64; margin:0 0 6px}
.rt-zone-h i{flex:1; height:1px; background:var(--line)}
.rt-zone .rt-stop{margin:0 0 6px}
.rt-zone .rt-chips{align-items:center}
.rt-zone .rt-body{padding-left:12px}
.rt-zone .rt-chips .amap-btn{margin:0 0 0 auto}
.rt-ic{width:14px; height:14px; stroke:#8f6b64; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto}
.rt-stop{background:var(--surface); border:1px solid var(--line); border-left:3px solid #8f6b64; border-radius:10px}
.rt-stop.optional{border-style:dashed; border-left-style:solid}
.rt-sum{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; list-style:none; cursor:pointer}
div.rt-sum{cursor:default}
.rt-sum::-webkit-details-marker{display:none}
.rt-rail[hidden]{display:none}
.rt-time{flex:0 0 auto; min-width:40px; padding-top:2px; font-size:12.5px; font-weight:600; color:#8f6b64; font-variant-numeric:tabular-nums}
.rt-time.rt-num{display:inline-grid; place-items:center; min-width:22px; height:22px; margin:1px 18px 0 0; padding:0; border:1.5px solid #8f6b64; border-radius:50%; font-size:11.5px}
.rt-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.rt-main b{font-size:15px; font-weight:700; color:var(--ink)}
.rt-main small{font-size:12px; color:var(--ink-soft); line-height:1.5}
.rt-chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:4px}
.rt-chip{display:inline-flex; align-items:center; gap:4px; font-size:11px; color:#8f6b64; border:1px solid #8f6b64; border-radius:4px; padding:1px 6px}
.rt-chev{width:16px; height:16px; stroke:#8f6b64; fill:none; stroke-width:2; margin-top:4px; flex:0 0 auto; transition:transform .15s}
details[open] > .rt-sum .rt-chev{transform:rotate(180deg)}
.rt-body{padding:0 12px 12px 62px; font-size:13px; color:var(--ink-soft)}
.rt-body p{margin:0 0 8px}
.rt-leg,.rt-gap{margin-left:14px; border-left:2px solid #8f6b64}
.rt-leg{display:flex; align-items:center; gap:6px; padding:6px 0 6px 18px; font-size:12px; color:var(--ink-soft)}
.rt-gap{height:12px}
.group-steps{margin:7px 0 0; padding-left:20px; font-size:12.5px; color:var(--ink-soft)}
.group-steps li{margin:4px 0}
.group-steps b{color:var(--ink); font-weight:600}
.tip .amap-btn,.group-head .amap-btn{display:inline-flex; padding:2px 7px; margin-left:4px; font-size:10.5px; gap:3px; border-radius:6px; min-height:0; line-height:1.5; height:auto; vertical-align:baseline}
.tip .amap-btn svg,.group-head .amap-btn svg{width:9px; height:9px}
.stop.in-group{border-left:3px solid var(--jade)}
.sub-head{grid-column:1/-1; font-size:12.5px; font-weight:700; color:var(--jade-ink); margin:6px 0 -2px; padding-left:8px; border-left:3px solid var(--jade)}
.stop.stay::before{border-color:var(--gold); background:var(--gold)}
.stop-time{display:flex; align-items:center; gap:4px; font-size:12px; font-weight:600; color:#8f6b64; font-variant-numeric:tabular-nums}
.stop.stay .stop-time{color:#8f6b64}
.stop-time .stay-icon{width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2}
.stop-time .stop-ico,.stop-time .stay-icon{width:15px; height:15px; stroke:#8f6b64; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto}
.stop-name{font-size:16px; font-weight:600; margin-top:2px}
.stop-name .en{font-weight:400; color:var(--ink-soft); font-size:13px; margin-left:6px}
.badge{display:inline-block; font-size:10.5px; font-weight:600; letter-spacing:.03em; padding:2px 7px;
    border-radius:6px; margin-left:6px; vertical-align:1px;}
.badge.optional{background:var(--gold-soft); color:var(--gold)}
.tip{font-size:13px; color:var(--ink-soft); margin-top:5px; padding:9px 11px; background:var(--surface-2);
    border-radius:10px; border-left:2px solid var(--jade);}
.tip .src{display:block; margin-top:5px; font-size:11.5px}
.tip .src a{color:var(--jade-ink); font-weight:600; text-decoration:none}
.stop-img{width:100%; aspect-ratio:16/9; height:auto; object-fit:cover; border-radius:10px; margin-top:8px; display:block; background:var(--surface-2); cursor:zoom-in}
.lb{position:fixed; inset:0; z-index:9999; background:rgba(15,25,32,.9); display:flex; align-items:center; justify-content:center; padding:12px; cursor:zoom-out}
.lb img{max-width:100%; max-height:100%; border-radius:8px; display:block}
.img-credit{margin-top:3px; font-size:10.5px; color:#8f6b64}
.row-actions{margin-top:7px; display:flex; flex-wrap:wrap; gap:8px}
.amap-btn{display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600;
    padding:8px 12px; border-radius:8px; background:var(--amap-bg); color:var(--amap-ink); text-decoration:none;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.amap-btn:active{transform:scale(.96)}
.amap-btn svg{width:12px; height:12px}
.amap-btn.trip{background:var(--gold-soft); color:var(--gold-ink)}
button.amap-btn{border:0; font-family:inherit; cursor:pointer}
.amap-btn.rn{background:var(--accent-soft); color:var(--accent-ink)}
.leg{display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px; margin:-6px 0 -6px; padding:2px 0 2px 4px; font-size:12.5px; line-height:1.5; color:var(--ink-soft); border-left:2px dashed var(--line); margin-left:-18px; padding-left:16px}
.leg-icon{font-size:13px; flex:0 0 auto}
.leg-text b{font-weight:600; color:var(--ink)}
.leg .amap-btn{padding:2px 7px; font-size:10.5px; gap:3px; border-radius:6px; min-height:0}
.leg .amap-btn svg{width:9px; height:9px}
.card-grid{display:flex; flex-direction:column; gap:10px}
.card{border:1px solid var(--line); border-radius:14px; padding:13px 14px; background:var(--surface); overflow:hidden;}
.card-img{width:calc(100% + 28px); margin:-13px -14px 10px; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--surface-2); cursor:zoom-in}
.card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px}
.card-name{font-size:15.5px; font-weight:600}
.card-name .en{display:block; font-weight:400; color:var(--ink-soft); font-size:12.5px; margin-top:1px}
.tag{flex:0 0 auto; font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:6px; white-space:nowrap;}
.tag.day{background:var(--accent-soft); color:var(--accent-ink)}
.tag.optional{background:var(--gold-soft); color:var(--gold)}
.card-desc{font-size:13px; color:var(--ink-soft); margin-top:6px}
.card-dish{font-size:13px; margin-top:6px}
.card-dish b{color:var(--accent-ink)}
.day-head{font-size:13px; font-weight:700; color:var(--ink); margin:16px 0 8px; line-height:1.4; scroll-margin-top:4px}
.day-head:first-child{margin-top:0}
.catnav{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 8px}
.catnav a{padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:var(--surface-2); font-size:12px; font-weight:600; color:var(--ink-soft); text-decoration:none}
.cat-head{font-size:12px; font-weight:700; color:var(--ink-soft); margin:12px 0 6px; scroll-margin-top:52px}
.note-card{display:flex; gap:10px; align-items:flex-start}
.note-ico{font-size:20px; line-height:1.3; flex:0 0 auto}
.note-text{font-size:13.5px; min-width:0}
.note-card.wide{grid-column:1/-1; width:100%}
.note-list{margin:6px 0 0; padding-left:18px}
.note-list li{margin:4px 0}
.note-text .src{display:block; margin-top:3px; font-size:11.5px}
.note-text .src a{color:var(--jade-ink); font-weight:600; text-decoration:none}
.tabbar{position:sticky; bottom:0; z-index:5; display:grid; grid-template-columns:repeat(4,1fr);
    background:var(--surface); border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom));}
.tab{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:52px;
    padding:6px 2px; border:none; background:none; color:var(--ink-soft); font:inherit; font-size:11px; font-weight:600;
    cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.tab svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7;}
.tab[aria-selected="true"]{color:var(--accent)}
.tab:active{transform:scale(.96)}
@media (prefers-reduced-motion:no-preference){.panel.show{animation:fade .18s ease-out}}
@keyframes fade{from{opacity:.5} to{opacity:1}}
@media (min-width:720px){body{min-height:100vh; align-items:center; padding:40px 16px}
.shell{max-width:860px; height:90vh; min-height:0; border-radius:20px;
      box-shadow:0 16px 60px var(--shadow); overflow:hidden;}
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px}
.stop-img{max-width:640px}}

function applyTheme(){

}

// Generic "open external site" icon (box + outward arrow) — shared by the Trip.com
// and RedNote buttons rather than hand-drawing a brand mark for each.
const EXT_LINK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 3h6v6M10 14L21 3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// 大众点评 search link on a meal stop; same look as the Trip.com button (class "trip").
function dianpingBtn(url){
  if(!url) return "";
  return `<a class="amap-btn trip" href="${esc(url)}" data-dp target="_blank" rel="noreferrer">${EXT_LINK_ICON}大众点评</a>`;
}
// On a phone, try the 大众点评 App first (the App searches in its own selected city; the web search page 403s inside the App); if the App did not take over
// within ~1.5 s (page still visible), fall back to the web search page. On a computer the link just opens the web page.
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-dp]"); if(!a) return;
  if(!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;
  const web = a.getAttribute("href");
  const shop = /\/shopinfo\/([A-Za-z0-9]+)/.exec(web);
  const kw = decodeURIComponent((web.split("/0_")[1] || ""));
  const app = shop ? "dianping://shopinfo?shopuuid=" + shop[1] : (kw ? "dianping://searchshoplist?keyword=" + encodeURIComponent(kw) : "");
  if(!app) return;
  e.preventDefault();
  let left = false;
  const onHide = () => { if(document.hidden) left = true; };
  document.addEventListener("visibilitychange", onHide);
  location.href = app;
  setTimeout(() => { document.removeEventListener("visibilitychange", onHide); if(!left) window.open(web, "_blank"); }, 1500);
});

function tripcomBtn(url){
  if(!url) return "";
  return `<a class="amap-btn trip" href="${esc(url)}" target="_blank" rel="noreferrer">${EXT_LINK_ICON}${esc(L().tripcom)}</a>`;
}

// A bookable tour / ticket link on a non-hotel stop: {url, label}. Same look as the Trip.com
// button, but deliberately NOT named `tripcom` — the day map treats `tripcom` as "this is a hotel".
function bookBtn(b){
  // {label, copy}: a WeChat mini-program (or any text-only code) cannot be opened from a web link, so the
  // button copies the share code to the clipboard to paste into WeChat.
  if(b && b.copy) return `<button type="button" class="amap-btn trip" data-copy="${esc(b.copy)}" data-done="${esc(b.done||"已复制，到微信粘贴打开")}">${EXT_LINK_ICON}${esc(b.label||L().tripcom)}</button>`;
  if(!b || !b.url) return "";
  return `<a class="amap-btn trip" href="${esc(b.url)}" target="_blank" rel="noreferrer">${EXT_LINK_ICON}${esc(b.label||L().tripcom)}</a>`;
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-copy]"); if(!el) return;
  const t = el.getAttribute("data-copy"), label = el.innerHTML;
  const done = () => { el.textContent = el.getAttribute("data-done"); setTimeout(() => { el.innerHTML = label; }, 2500); };
  try { navigator.clipboard.writeText(t).then(done, () => { const x = document.createElement("textarea"); x.value = t; document.body.appendChild(x); x.select(); try{ document.execCommand("copy"); }catch(_){} x.remove(); done(); }); }
  catch(_){ const x = document.createElement("textarea"); x.value = t; document.body.appendChild(x); x.select(); try{ document.execCommand("copy"); }catch(__){} x.remove(); done(); }
});

function srcBtn(url, label){
  return url ? `<div class="row-actions"><a class="amap-btn rn" href="${esc(url)}" target="_blank" rel="noreferrer">${EXT_LINK_ICON}${esc(label || L().redSource)}</a></div>` : "";
}

function srcLink(url, label){
  return url ? `<a class="amap-btn rn" href="${esc(url)}" target="_blank" rel="noreferrer">${EXT_LINK_ICON}${esc(label || L().redSource)}</a>` : "";
}

function rednoteBtn(url){
  if(!url) return "";
  return `<a class="amap-btn rn" href="${esc(url)}" target="_blank" rel="noreferrer">${EXT_LINK_ICON}${esc(L().rednote)}</a>`;
}

// The transit leg into a stop — a light connector row, not a full stop card, so a
// 10-minute walk doesn't compete visually with an actual place worth stopping at.
function transitHtml(t){
  if(!t) return "";
  const modeKey = {walk:"transitWalk", transit:"transitTransit", taxi:"transitTaxi",
                    bike:"transitBike", train:"transitTrain", drive:"transitDrive"}[t.mode];
  const label = modeKey ? L()[modeKey] : (t.mode || L().transitOther);
  // A route leg is NOT a card: it is a light connector line on the timeline (icon + one line of text + a text link),
  // so places (cards) and the way between them read differently.
  const icon = {walk:"🚶", transit:"🚇", taxi:"🚕", bike:"🚲", train:"🚆", drive:"🚗"}[t.mode] || "➜";
  return `<div class="leg">
      <span class="leg-icon" title="${esc(label)}">${icon}</span>
      <span class="leg-text"><b>${esc(label)}</b> · ${esc(t.detail||"")}</span>
      ${t.amap?amapBtn(t.amap,L().route):""}
    </div>`;
}

const STAY_HOUSE_ICON = `<svg class="stay-icon" viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12M3 21h18M9 21v-6h6v6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

// A "stay" is folded into the day's own route as one of its timeline entries —
// slotted in by stay.time next to the stops it actually falls between — rather
// than floating in a separate card above it.
function stayAsStop(stay){
  const eventLabel = {checkin:L().checkin, checkout:L().checkout, depart:L().depart, staying:L().staying}[stay.event] || L().stay;
  return {
    time: STAY_HOUSE_ICON + esc(eventLabel) + (stay.time ? ` · ${esc(stay.time)}` : ""),
    timeIsHtml: true,
    sortTime: stay.time || null,
    name: stay.name, en: stay.en, amap: stay.amap, tripcom: stay.tripcom, image: stay.image, image_credit: stay.image_credit,
    tip: stay.note || "", isStay: true, transit: stay.transit,
  };
}

// No stay.time given -> keep the old default (day's first entry), since that's
// right for the common case (checkout in the morning, or no event change at
// all). A real clock time slots it precisely instead — e.g. an evening
// check-in that belongs after the day's last stop, not before its first one.
function mergeStay(stay, stops){
  if(!stay) return stops;
  const s = stayAsStop(stay);
  if(!s.sortTime) return [s, ...stops];
  const at = stops.findIndex(st => st.time && st.time > s.sortTime);
  return at === -1 ? [...stops, s] : [...stops.slice(0, at), s, ...stops.slice(at)];
}

// Tap a stop photo to see the whole picture full screen; tap again to close.
document.addEventListener("click", e => {

// Sub-category route (plan A): a rail of stop cards. Each card shows time, name, a one-line highlight and small tags;
// the full note folds into the card (<details>, no scripts). Used for groups whose title is a route (路线 / 右线 / 左线).
const RT_ICONS = {
  cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 100-8 4 4 0 000 8z"/>',
  warn:'<path d="M12 3l10 18H2zM12 10v5M12 18v.5"/>',
  taxi:'<path d="M4 15l2-6h12l2 6v4H4zM7 19v2M17 19v2M8 12h8"/>',
  walk:'<path d="M12 5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM10 21l2-7-3-3 2-4 3 3 3 1M13 14l3 7"/>',
  pin:'<path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  chev:'<path d="M6 9l6 6 6-6"/>'
};
function rtIcon(k, cls){
  return RT_ICONS[k] ? `<svg class="${cls || "rt-ic"}" viewBox="0 0 24 24" aria-hidden="true">${RT_ICONS[k]}</svg>` : "";
}
function isRouteGroup(name){ return /路线|右线|左线/.test(name || ""); }
function routeStep(x, i){
  const m = /^(\d{1,2}:\d{2})\s+(.*)$/.exec(x.name || "");
  const time = x.time || (m ? m[1] : "");
  const label = x.label || (m ? m[2] : (x.name || ""));
  const note = x.note || "";
  const first = (/^[^。；]+/.exec(note) || [""])[0].trim();
  let sub = x.sub != null ? x.sub : (first.length > 34 ? first.slice(0, 32) + "…" : first);
  const fold = note && note.replace(/\s/g, "") !== sub.replace(/\s/g, "");
  const optional = /可选|时间够再去/.test(label);
  let tags = x.tags;
  if(!tags){
    tags = [];
    if(/拍|出片|机位|打卡/.test(note)) tags.push(["cam", "拍照点"]);
    if(/避坑|别信|小心|湿滑|别选|当心|注意|高反/.test(note)) tags.push(["warn", "注意"]);
  }
  const chips = tags.map(c => `<span class="rt-chip">${rtIcon(c[0])}${esc(c[1])}</span>`).join("");
  const num = time ? esc(time) : String(i + 1);
  const head = `<span class="rt-time${time ? "" : " rt-num"}">${num}</span>
      <span class="rt-main"><b>${esc(label)}</b>${sub ? `<small>${esc(sub)}</small>` : ""}${chips ? `<span class="rt-chips">${chips}</span>` : ""}</span>`;
  const cls = `rt-stop${x.focal ? " focal" : ""}${optional ? " optional" : ""}`;
  const leg = i > 0 && x.leg ? `<div class="rt-leg">${rtIcon(/打车/.test(x.leg) ? "taxi" : "walk")}<span>${esc(x.leg)}</span></div>` : (i > 0 ? `<div class="rt-gap"></div>` : "");
  if(!fold) return leg + `<div class="${cls}"><div class="rt-sum">${head}</div></div>`;
  return leg + `<details class="${cls}"><summary class="rt-sum">${head}${rtIcon("chev", "rt-chev")}</summary>
      <div class="rt-body"><p>${esc(note)}</p>${x.amap ? amapBtn(x.amap, "导航") : ""}</div></details>`;
}
const RT_TOGGLE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>`;
function rtBar(body, route){
  if(route) return body ? `<div class="rt-bar"><button type="button" class="amap-btn rn rt-toggle" data-rt-route aria-expanded="false">${RT_TOGGLE_ICON}<span>展开路线</span></button></div>` : "";
  return body.indexOf("<details") >= 0 ? `<div class="rt-bar"><button type="button" class="amap-btn rn rt-toggle" data-rt-toggle>${RT_TOGGLE_ICON}<span>展开细节</span></button></div>` : "";
}
function routeSteps(steps){
  const body = (steps || []).map(routeStep).join("");
  return rtBar(body, true) + `<div class="rt-rail" hidden>${body}</div>`;
}
// Shop sub-category (no order): shops grouped into zones by x.zone; each card shows name, one line, tags and the 导航 button; the note folds.
function shopStep(x){
  const chips = (x.tags || []).map(c => `<span class="rt-chip">${esc(c[1])}</span>`).join("");
  const head = `<span class="rt-main"><b>${esc(x.name)}</b>${x.sub ? `<small>${esc(x.sub)}</small>` : ""}${chips || (x.amap && !x.nonav) ? `<span class="rt-chips">${chips}${x.amap && !x.nonav ? amapBtn(x.amap, "导航") : ""}</span>` : ""}</span>`;
  if(!x.note) return `<div class="rt-stop"><div class="rt-sum">${head}</div></div>`;
  return `<details class="rt-stop"><summary class="rt-sum">${head}${rtIcon("chev", "rt-chev")}</summary><div class="rt-body"><p>${esc(x.note)}</p></div></details>`;
}
function zoneSteps(steps){
  const zones = [];
  (steps || []).forEach(x => {
    let z = zones.find(q => q.n === x.zone);
    if(!z){ z = {n: x.zone, a: []}; zones.push(z); }
    z.a.push(x);
  });
  const body = zones.map(z => `<div class="rt-zone"><div class="rt-zone-h">${esc(z.n)}<i></i></div>${z.a.map(shopStep).join("")}</div>`).join("");
  return rtBar(body) + `<div class="rt-rail">${body}</div>`;
}
// "展开全部细节 / 收起全部细节": opens or closes every folded stop of one route at once; the label follows manual toggles too.
function rtSync(head){
  const btn = head && head.querySelector("[data-rt-toggle]");
  if(!btn) return;
  const ds = head.querySelectorAll("details.rt-stop");
  btn.querySelector("span").textContent = [...ds].some(d => !d.open) ? "展开细节" : "收起细节";
}
// "展开路线 / 收起路线": a route is folded to its title; one tap shows the whole route with every stop's detail open.
document.addEventListener("click", e => {
  const rb = e.target.closest("[data-rt-route]"); if(!rb) return;
  const head = rb.closest(".group-head");
  const rail = head.querySelector(".rt-rail");
  const open = rail.hidden;
  rail.hidden = !open;
  if(open) rail.querySelectorAll("details.rt-stop").forEach(d => { d.open = true; });
  rb.setAttribute("aria-expanded", open);
  rb.querySelector("span").textContent = open ? "收起路线" : "展开路线";
});
document.addEventListener("click", e => {
  const btn = e.target.closest("[data-rt-toggle]"); if(!btn) return;
  const head = btn.closest(".group-head");
  const ds = head.querySelectorAll("details.rt-stop");
  const open = [...ds].some(d => !d.open);
  ds.forEach(d => { d.open = open; });
  rtSync(head);
});
document.addEventListener("toggle", e => {
  if(e.target.matches && e.target.matches("details.rt-stop")) rtSync(e.target.closest(".group-head"));
}, true);

function groupHtml(s){
  // A sub-category of consecutive stops (e.g. one walking route through an area): shown once, before its first stop.
  const steps = (s.group_steps || []).map(x => `<li>${x.name?`<b>${esc(x.name)}</b>：`:""}${esc(x.note||"")}${x.amap?` ${amapBtn(x.amap,"导航")}`:""}</li>`).join("");
  return `<div class="group-head"><div class="group-title">${esc(s.group)}</div>${s.group_note?`<div class="group-note">${esc(s.group_note)}</div>`:""}${(s.group_steps||[]).some(x=>x.zone) ? zoneSteps(s.group_steps) : isRouteGroup(s.group) ? routeSteps(s.group_steps) : (steps?`<ol class="group-steps">${steps}</ol>`:"")}${s.group_source?`<div class="row-actions"><a class="amap-btn rn" href="${esc(s.group_source)}" target="_blank" rel="noreferrer">${EXT_LINK_ICON}${esc(s.group_source_title || "小红书来源")}</a></div>`:""}</div>`;
}

// One small line icon per itinerary stop, picked from the stop's title (always #8f6b64 via CSS).
const STOP_ICONS = {

  bag:'<path d="M5 8h14l-1 12H6zM9 8a3 3 0 016 0"/>',
  pin:'<path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>'
};
function stopIconKey(s){
  const n = s.name || "";
  if(/三桥|景区|九寨沟|地缝|峡|仙女山|熊猫谷/.test(n) && !/熊猫谷/.test(n)) return "mountain";
  if(/^(午餐|晚餐|夜宵|火锅晚餐)/.test(n) || s.kind === "meal") return "food";
  if(/酒店|入住|寄存/.test(n) || s.kind === "hotel") return "house";
  if(/买|礼|候机逛/.test(n)) return "bag";
  if(/熊猫/.test(n)) return "panda";
  if(/轻轨|机场站|北站|东站|站/.test(n)) return "train";
  if(/步行街/.test(n)) return "city";
  if(/机场/.test(n)) return "plane";
  if(/茶社|咖啡|茶/.test(n)) return "cup";
  if(/寺|祠|庙/.test(n)) return "temple";
  if(/夜景|夜逛|蓝眼泪|廊桥|桥|洪崖洞|锦里/.test(n)) return "moon";
  if(/巷|街|梯|碑|古城|太古里|步行街|东郊记忆|园|路/.test(n)) return "city";
  return "pin";
}
function stopIcon(s){
  return `<svg class="stop-ico" viewBox="0 0 24 24" aria-hidden="true">${STOP_ICONS[stopIconKey(s)]}</svg>`;
}

function stopHtml(s){
  return `
    <div class="stop${s.optional?" optional":""}${s.isStay?" stay":""}${s.group?" in-group":""}">
      <div class="stop-time">${s.timeIsHtml ? s.time : stopIcon(s) + esc(s.time||"")}</div>
      <div class="stop-name">${esc(s.name)}${s.en?`<span class="en">${esc(s.en)}</span>`:""}${s.optional?`<span class="badge optional">${L().optional}</span>`:""}</div>
      ${s.image?`<img class="stop-img" src="${esc(s.image)}" alt="" loading="lazy">${s.image_credit?`<div class="img-credit">${esc(s.image_credit)}</div>`:""}`:""}
      ${tipHtml(s.tip, s.source, s.source_title)}

      <div class="row-actions">${amapBtn(s.amap)}${tripcomBtn(s.tripcom)}${bookBtn(s.book)}${dianpingBtn(s.dianping)}${rednoteBtn(s.rednote)}</div>

}

function renderItinerary(){

    `<button type="button" class="daychip" data-day="${i}" role="tab" aria-selected="${i===0}">${dayLabel(d.day)} · ${esc(fmtDate(d.date))}</button>`
  ).join("");

function renderSights(){
  const panel = document.getElementById("panel-sights");
  // Sights are grouped by day like the Food tab: every itinerary stop of the day except the ones marked
  // kind:"transport" / "meal" / "hotel", then any extra `sights` entries of that day (alternatives not on the route).
  const SKIP = ["transport","meal","hotel"];
  const byDay = {};
  TRIP.days.forEach(d => {
    const items = d.stops.filter(x => SKIP.indexOf(x.kind) < 0).map(x => ({...x, day:d.day, desc:x.sight_desc || x.tip, route:true}));
    const have = new Set(items.map(x => x.name));
    (TRIP.sights || []).filter(x => x.day === d.day && !have.has(x.name)).forEach(x => items.push({...x, extra:true}));
    if(items.length) byDay[d.day] = items;
  });
  (TRIP.sights || []).filter(x => !x.day).forEach(x => (byDay[0] = byDay[0] || []).push({...x, extra:true}));
  const dayKeys = Object.keys(byDay).map(Number).sort((a,b) => (a||1e9) - (b||1e9));
  const card = x => `
    <div class="card">
      ${x.image?`<img class="card-img" src="${esc(x.image)}" alt="" loading="lazy">${x.image_credit?`<div class="img-credit" style="margin:-7px 0 8px">${esc(x.image_credit)}</div>`:""}`:""}
      <div class="card-top">
        <div class="card-name">${esc(x.name)}${x.en?`<span class="en">${esc(x.en)}</span>`:""}</div>
        ${x.optional?`<span class="tag optional">${L().optional}</span>`:(x.extra?`<span class="tag optional">${L().alt}</span>`:(x.time?`<span class="tag day">${esc(x.time)}</span>`:""))}
      </div>
      ${x.desc?`<div class="card-desc">${esc(x.desc)}</div>`:""}
      <div class="row-actions">${amapBtn(x.amap)}${tripcomBtn(x.tripcom)}${bookBtn(x.book)}${rednoteBtn(x.rednote)}${srcLink(x.source, x.source_title)}</div>
    </div>`;
  panel.innerHTML = dayKeys.map(k => {
    const d = TRIP.days.find(x => x.day === k);
    const head = k ? `${dayLabel(k)}${d && d.date ? " · " + fmtDate(d.date) : ""}${d && d.label ? " · " + d.label : ""}` : L().secFoodOther;
    return `<p class="day-head" id="sight-day-${k}">${esc(head)}</p><div class="card-grid">${(() => { let prev = null; return byDay[k].map(x => { const sub = x.group && x.group !== prev ? `<div class="sub-head">${esc(x.group)}</div>` : ""; prev = x.group || null; return sub + card(x); }).join(""); })()}</div>`;
  }).join("");
}

const TYPE_ORDER = ["饭馆","面馆","火锅","烤肉","宫宴餐秀","小吃","糕点","甜品","奶茶","酸奶/奶酪","咖啡","茶馆","外卖"];
function renderFood(){
  const panel = document.getElementById("panel-food");
  // Food is grouped by day (each `food` item's `day`), in day order, under a day heading
  // (day number · date · the day's label). Items with no `day` go last under "Other".
  const foodCard = f => `
      <div class="card">
        ${f.image?`<img class="card-img" src="${esc(f.image)}" alt="" loading="lazy">`:""}
        <div class="card-top">
          <div class="card-name">${esc(f.name)}${f.en?`<span class="en">${esc(f.en)}</span>`:""}</div>
          ${f.type?`<span class="tag day">${esc(f.type)}</span>`:""}
        </div>
        ${f.near?`<div class="card-dish"><b>${TRIP.trip.lang === "en" ? "Near" : "靠近"}:</b> ${esc(f.near)}</div>`:""}
        ${f.dish?`<div class="card-dish"><b>${L().tryDish}:</b> ${esc(f.dish)}</div>`:""}
        ${f.note?`<div class="card-desc">${esc(f.note)}</div>`:""}
        <div class="row-actions">${amapBtn(f.amap)}${dianpingBtn(f.dianping)}${rednoteBtn(f.rednote)}${srcLink(f.source, f.source_title)}</div>
      </div>`;
  const byDay = {};
  TRIP.food.forEach(f => { const k = f.day || 0; (byDay[k] = byDay[k] || []).push(f); });
  const dayKeys = Object.keys(byDay).map(Number).sort((a,b) => (a||1e9) - (b||1e9));
  const foodHtml = dayKeys.map(k => {
    const d = TRIP.days.find(x => x.day === k);
    const head = k ? `${dayLabel(k)}${d && d.date ? " · " + fmtDate(d.date) : ""}${d && d.label ? " · " + d.label : ""}` : L().secFoodOther;
    // Inside a day, group by the item's `type` (正餐 / 火锅 / 小吃 ...) in TYPE_ORDER, with a row of
    // category links under the day heading that jump to each group.
    const groups = {};
    byDay[k].forEach(f => { const t = f.type || L().secFoodOther; (groups[t] = groups[t] || []).push(f); });
    const rank = t => { const i = TYPE_ORDER.indexOf(t); return i < 0 ? 99 : i; };
    const types = Object.keys(groups).sort((a,b) => rank(a) - rank(b));
    // Inside each group, follow the itinerary order of the sight the place is near (`near_rank`); unranked items keep their order.
    Object.values(groups).forEach(g => g.sort((x, y) => (x.near_rank || 99) - (y.near_rank || 99)));
    const catNav = `<div class="catnav">${types.map((t,i) => `<a href="#food-day-${k}-${i}" data-cat="food-day-${k}-${i}">${esc(t)} ${groups[t].length}</a>`).join("")}</div>`;
    return `<p class="day-head" id="food-day-${k}">${esc(head)}</p>${catNav}` + types.map((t,i) =>
      `<p class="cat-head" id="food-day-${k}-${i}">${esc(t)} · ${groups[t].length}</p><div class="card-grid">${groups[t].map(foodCard).join("")}</div>`).join("");
  }).join("");
  panel.innerHTML = foodHtml;
  panel.querySelectorAll(".catnav a").forEach(a => a.addEventListener("click", e => {
    e.preventDefault();
    const el = document.getElementById(a.dataset.cat);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }));
}

function renderNotes(){
  const panel = document.getElementById("panel-notes");
  // Notes are grouped like Food / Sights: by the `day` of each note (in day order), notes without a `day` go last under "Other".
  const item = n => {
    const m = String(n.text).match(/^(\p{Extended_Pictographic}(?:️|‍|\p{Extended_Pictographic})*)\s*/u);
    const ico = m ? m[1] : "", body = m ? n.text.slice(m[0].length) : n.text;
    // A note with several lines renders as a title + bullets, full width (spans the whole grid row).
    const lines = body.split("\n").map(x => x.trim()).filter(Boolean);
    const inner = lines.length > 1 ? `<b>${esc(lines[0])}</b><ul class="note-list">${lines.slice(1).map(x => `<li>${esc(x.replace(/^[•·-]\s*/, ""))}</li>`).join("")}</ul>` : esc(body);
    return `<div class="card note-card${lines.length > 1 ? " wide" : ""}">${ico ? `<span class="note-ico">${esc(ico)}</span>` : ""}<div class="note-text">${inner}${srcBtn(n.source, n.source_label)}</div></div>`;
  };
  const byDay = {};
  TRIP.notes.forEach(n => { const k = n.day || 0; (byDay[k] = byDay[k] || []).push(n); });
  const keys = Object.keys(byDay).map(Number).sort((a,b) => a - b);
  panel.innerHTML = keys.map(k => {
    const d = TRIP.days.find(x => x.day === k);
    const head = k ? `${dayLabel(k)}${d && d.date ? " · " + fmtDate(d.date) : ""}${d && d.label ? " · " + d.label : ""}` : (TRIP.trip.lang === "en" ? "General" : "通用事项");
    return `<p class="day-head" id="note-day-${k}">${esc(head)}</p><div class="card-grid">${byDay[k].slice().sort((x, y) => (String(y.text).includes("\n") ? 1 : 0) - (String(x.text).includes("\n") ? 1 : 0)).map(item).join("")}</div>`;
  }).join("");
}

// On open, jump to today's day if today falls inside the trip dates (device clock); otherwise stay on day 1.
function openToday(iso){
  if(!iso){ const n = new Date(), p = x => String(x).padStart(2, "0"); iso = `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())}`; }
  const i = TRIP.days.findIndex(d => d.date === iso);
  if(i < 0) return;
  const chip = document.querySelector(`#daychips .daychip[data-day="${i}"]`);
  if(chip) chip.click();
}

function initTabs(){
  const tabs = document.querySelectorAll(".tab");
  const panels = {itinerary: document.getElementById("panel-itinerary"),
                  sights: document.getElementById("panel-sights"),
                  food: document.getElementById("panel-food"),
                  notes: document.getElementById("panel-notes")};
  const chips = document.getElementById("daychips");
  // The day chips under the title are shared by Itinerary, Food and Sights: on Itinerary they switch the day,
  // on Food / Sights they scroll to that day's section.
  let cur = "itinerary";
  const dayNo = () => { const b = chips.querySelector('.daychip[aria-selected="true"]'); return b ? TRIP.days[+b.dataset.day].day : TRIP.days[0].day; };
  const jump = (smooth) => {
    const id = (cur==="food" ? "food-day-" : cur==="notes" ? "note-day-" : "sight-day-") + dayNo(), el = document.getElementById(id), box = document.querySelector(".panels");
    if(!el) return;
    const behavior = smooth ? "smooth" : "auto";
    if(box.scrollHeight > box.clientHeight + 2){   // desktop: the panel itself scrolls
      box.scrollTo({top: Math.max(0, box.scrollTop + el.getBoundingClientRect().top - box.getBoundingClientRect().top - 4), behavior});
    } else {                                       // phone: the whole page scrolls under the sticky header
      const head = document.querySelector(".head");
      window.scrollTo({top: Math.max(0, window.scrollY + el.getBoundingClientRect().top - (head ? head.offsetHeight : 0) - 6), behavior: "auto"});  // instant: smooth window scrolling is unreliable on some phone browsers
    }
  };
  function activate(name){
    cur = name;
    tabs.forEach(t => t.setAttribute("aria-selected", t.dataset.tab===name));
    Object.entries(panels).forEach(([k,el]) => el.classList.toggle("show", k===name));
    chips.style.display = "flex";
    document.querySelector(".panels").scrollTop = 0; window.scrollTo(0, 0);
    if(name==="food" || name==="sights" || name==="notes") jump(false);
  }
  chips.addEventListener("click", e => { if(e.target.closest(".daychip") && (cur==="food" || cur==="sights" || cur==="notes")) setTimeout(() => jump(true), 0); });
  tabs.forEach(t => t.addEventListener("click", () => activate(t.dataset.tab)));
  activate("itinerary");
}

// Amap mobile deep-link interceptor — opens the native app on a phone tap.
(function(){
  var ua=navigator.userAgent, iOS=/iPhone|iPad|iPod/i.test(ua)||(/Mac/.test(ua)&&'ontouchend' in document), AND=/Android/i.test(ua);
  if(!iOS&&!AND) return;
  var scheme=iOS?'iosamap://':'androidamap://';
  function q(u){var o={},s=u.split('?')[1]||'';s.split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0)o[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});return o;}
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href*="uri.amap.com"]'); if(!a) return;
    var href=a.getAttribute('href')||'', p=q(href), native='';
    if(/uri\.amap\.com\/marker/.test(href)&&p.position){var c=p.position.split(',');
      native=scheme+'viewMap?sourceApplication=itinerary&poiname='+encodeURIComponent(p.name||'')+'&lat='+c[1]+'&lon='+c[0]+'&dev=0';}
    else if(/uri\.amap\.com\/search/.test(href)&&p.keyword){
      // Amap's POI-search action is "poi" on both platforms — NOT "search" (that action name isn't recognized).
      native=scheme+'poi?sourceApplication=itinerary&keywords='+encodeURIComponent(p.keyword)+'&city='+encodeURIComponent(p.city||'')+'&dev=0';}
    else if(/uri\.amap\.com\/navigation/.test(href)&&p.to){var t=String(p.to).split(',');
      // Amap's routing action is named "path" on iOS but "route" on Android — using the wrong one per-platform silently fails to launch the app.
      if(t.length>=2) native=scheme+(iOS?'path':'route')+'?sourceApplication=itinerary&dlat='+t[1]+'&dlon='+t[0]+'&dname='+encodeURIComponent(t[2]||'')+'&dev=0&t=0';}
    if(!native) return;
    e.preventDefault();
    var t0=Date.now(); window.location.href=native;
    setTimeout(function(){ if(Date.now()-t0<1600 && !document.hidden){ window.location.href=href; } },1100);
  },true);
})();

// RedNote (小红书) on phones: the app does not understand rednote.com/search_result?... links (it shows
// "你访问的页面不见了"), so on a phone tap we open the app's own scheme directly (search / note by id).
// If the app does not take over within ~1.2 s (not installed), fall back to the web page in a new tab.
(function(){
  var ua=navigator.userAgent, iOS=/iPhone|iPad|iPod/i.test(ua)||(/Mac/.test(ua)&&'ontouchend' in document), AND=/Android/i.test(ua);
  if(!iOS&&!AND) return;
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href*="rednote.com"]'); if(!a) return;
    var href=(a.getAttribute('href')||'').replace(/&amp;/g,'&'), native='', m;
    if(/\/search_result/.test(href) && (m=href.match(/[?&]keyword=([^&]+)/))){ native='xhsdiscover://search/result?keyword='+m[1]; }
    else if((m=href.match(/\/(?:discovery\/item|explore)\/([a-zA-Z0-9]+)/))){ native='xhsdiscover://item/'+m[1]; }
    if(!native) return;
    e.preventDefault();
    var t0=Date.now(), left=false;
    var onHide=function(){ left=true; };
    document.addEventListener('visibilitychange',onHide,{once:true}); window.addEventListener('pagehide',onHide,{once:true});
    window.location.href=native;
    setTimeout(function(){ if(!left && !document.hidden && Date.now()-t0<2500){ window.open(href.replace('www.rednote.com','www.xiaohongshu.com'),'_blank'); } },1200);
  },true);
})();

// ---- day map + route list (top of Itinerary) ----
(function(){
  const COL=['#b8402f','#2b6f5e','#3a5f9c','#7a3d8f','#c26a1b'];
  const pos=u=>{const m=(u||'').match(/position=([\d.]+)(?:%2C|,)([\d.]+)/);return m?[+m[1],+m[2]]:null;};
  const pts=i=>{const d=TRIP.days[i];return mergeStay(d.stay,d.stops).map(s=>({
    name:s.name,time:(s.isStay?s.sortTime:s.time)||'',hotel:!!(s.isStay||s.tripcom),opt:!!s.optional,
    amap:s.amap,tripcom:s.tripcom,ll:pos(s.amap)})).filter(p=>p.ll);};
  const multi=list=>'https://uri.amap.com/marker?markers='+list.slice(0,40).map(p=>p.ll[0]+','+p.ll[1]+','+encodeURIComponent(p.name.replace(/[,|]/g,' ').slice(0,28))).join('|')+'&src=itinerary&coordinate=gaode&callnative=1';
  const panel=document.getElementById('panel-sights');
  panel.insertAdjacentHTML('afterbegin',`<section class="mapcard" id="mapcard">
    <div class="maptitle">每日路线地图</div>
    <div class="mapchips" id="mapchips">${TRIP.days.map((d,i)=>`<button type="button" class="mapchip" data-i="${i}" aria-selected="${i===0}">${dayLabel(d.day)}</button>`).join('')}<button type="button" class="mapchip" data-i="all" aria-selected="false">全部</button></div>
    <div id="daymap"></div>
    <ul class="maplist" id="maplist"></ul>
    <div class="row-actions mapall" id="mapall"></div>
    <p class="mapnote">编号 = 当天顺序;金色方块 = 酒店;虚线圈 = 可选。底图来自高德,加载不出来时,下面的列表和按钮照样可用。</p></section>`);
  const LF=window.L; // page already has its own const L (labels), so use the Leaflet global via window
  let map=null, layer=null, cur=0;
  const pin=(p,n,c)=>`<div class="pin${p.hotel?' hotel':''}${p.opt?' opt':''}" style="background:${c}">${p.hotel?'宿':n}</div>`;
  function draw(sel){
    cur=sel;
    document.querySelectorAll('#mapchips .mapchip').forEach(b=>b.setAttribute('aria-selected',b.dataset.i===String(sel)));
    const days=sel==='all'?TRIP.days.map((_,i)=>i):[sel];
    const all=[];
    if(map){layer.clearLayers();}
    days.forEach(i=>{
      const list=pts(i), c=COL[i%COL.length];
      list.forEach(p=>all.push(p));
      if(!map) return;
      LF.polyline(list.map(p=>[p.ll[1],p.ll[0]]),{color:c,weight:3,opacity:.75,dashArray:'6 6'}).addTo(layer);
      let n=0;
      list.forEach(p=>{ if(!p.hotel) n++;
        LF.marker([p.ll[1],p.ll[0]],{icon:LF.divIcon({className:'',html:pin(p,sel==='all'?('D'+TRIP.days[i].day):n,c),iconSize:[24,24],iconAnchor:[12,12]})})
          .bindPopup(`<b>${esc(p.name)}</b><br>${esc(p.time)}<br><a href="${esc(p.amap)}" target="_blank" rel="noreferrer">在高德打开</a>`).addTo(layer);});
    });
    if(map&&all.length){ map.fitBounds(all.map(p=>[p.ll[1],p.ll[0]]),{padding:[24,24],maxZoom:15}); }
    const ul=document.getElementById('maplist'); ul.innerHTML='';
    days.forEach(i=>{
      const list=pts(i), c=COL[i%COL.length]; let n=0;
      if(sel==='all') ul.insertAdjacentHTML('beforeend',`<li style="font-weight:700;margin-top:6px">${dayLabel(TRIP.days[i].day)} · ${esc(fmtDate(TRIP.days[i].date))}</li>`);
      list.forEach(p=>{ if(!p.hotel) n++;
        ul.insertAdjacentHTML('beforeend',`<li><span class="n${p.hotel?' hotel':''}" style="background:${c}">${p.hotel?'宿':n}</span><span class="t">${esc(p.time)}</span><span class="nm">${esc(p.name)}${p.opt?'<em>可选</em>':''}</span><a href="${esc(p.amap)}" target="_blank" rel="noreferrer">高德</a>${p.tripcom?`<a class="tc" href="${esc(p.tripcom)}" target="_blank" rel="noreferrer">Trip.com</a>`:''}</li>`);});
    });
    document.getElementById('mapall').innerHTML=`<a class="amap-btn" href="${esc(multi(all))}" target="_blank" rel="noreferrer">在高德地图查看${sel==='all'?'全部':'当天'} ${all.length} 个地点</a>`;
  }
  try{
    if(LF && LF.map){
      map=LF.map('daymap',{zoomControl:true,attributionControl:true}).setView([39.92,116.40],11);
      LF.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18,attribution:'© 高德地图'}).addTo(map);
      layer=LF.layerGroup().addTo(map);
    } else { document.getElementById('daymap').style.display='none'; }
  }catch(e){ map=null; document.getElementById('daymap').style.display='none'; }
  draw(0);
  document.getElementById('mapchips').addEventListener('click',e=>{
    const b=e.target.closest('.mapchip'); if(!b) return;
    const v=b.dataset.i==='all'?'all':+b.dataset.i; draw(v);
    if(v!=='all'){ const h=document.querySelector(`#daychips .daychip[data-day="${v}"]`); if(h) h.click(); }
  });
  document.getElementById('daychips').addEventListener('click',e=>{
    const b=e.target.closest('.daychip'); if(b && String(cur)!==b.dataset.day) draw(+b.dataset.day);
  });
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ if(map&&t.dataset.tab==='sights') setTimeout(()=>{map.invalidateSize(); draw(cur);},50); }));
})();
 setTimeout(openToday, 0);
</script>
<script>document.addEventListener('click',e=>{const n=e.target.closest('.stop-name,.stop-time');if(n)n.closest('.stop').classList.toggle('open')})</script><script>(function(){
  var COL=['#b8402f','#2b6f5e','#3a5f9c','#7a3d8f','#c26a1b'], LF=window.L, built=false;
  var pos=function(u){var m=(u||'').match(/position=([\d.]+)(?:%2C|,)([\d.]+)/);return m?[+m[1],+m[2]]:null;};
  function build(){
    if(built||!LF||!LF.map) return; built=true;
    document.querySelectorAll('#panel-sights .day-head[id^="sight-day-"]').forEach(function(h){
      var d=TRIP.days.find(function(x){return 'sight-day-'+x.day===h.id;}); if(!d) return;
      var i=TRIP.days.indexOf(d), c=COL[i%COL.length], n=0;
      var pts=d.stops.map(function(s){return {s:s,ll:pos(s.amap)};}).filter(function(p){return p.ll;});
      if(!pts.length) return;
      var t=document.createElement('div'); t.className='maptitle'; t.textContent=dayLabel(d.day)+' 路线地图'; h.insertAdjacentElement('afterend',t);
      var el=document.createElement('div'); el.className='daymini'; t.insertAdjacentElement('afterend',el);
      var m=LF.map(el,{zoomControl:false,attributionControl:false});
      LF.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:18}).addTo(m);
      LF.polyline(pts.map(function(p){return [p.ll[1],p.ll[0]];}),{color:c,weight:3,opacity:.75,dashArray:'6 6'}).addTo(m);
      pts.forEach(function(p){var hotel=!!(p.s.isStay||p.s.tripcom); if(!hotel) n++;
        LF.marker([p.ll[1],p.ll[0]],{icon:LF.divIcon({className:'',html:'<div class="pin'+(hotel?' hotel':'')+'" style="background:'+c+'">'+(hotel?'宿':n)+'</div>',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(m);});
      m.fitBounds(pts.map(function(p){return [p.ll[1],p.ll[0]];}),{padding:[20,20],maxZoom:15});
      el._m=m; el._b=pts.map(function(p){return [p.ll[1],p.ll[0]];});
      var esc2=function(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
      var k=0, li=pts.map(function(p){var s=p.s, hotel=!!(s.isStay||s.tripcom); if(!hotel) k++;
        return '<li><span class="n'+(hotel?' hotel':'')+'" style="background:'+c+'">'+(hotel?'宿':k)+'</span><span class="t">'+esc2(s.time)+'</span><span class="nm">'+esc2(s.name)+(s.optional?'<em>可选</em>':'')+'</span><a href="'+esc2(s.amap)+'" target="_blank" rel="noreferrer">高德</a>'+(s.tripcom?'<a class="tc" href="'+esc2(s.tripcom)+'" target="_blank" rel="noreferrer">Trip.com</a>':'')+'</li>';}).join('');
      var url='https://uri.amap.com/marker?markers='+pts.slice(0,40).map(function(p){return p.ll[0]+','+p.ll[1]+','+encodeURIComponent(String(p.s.name).replace(/[,|]/g,' ').slice(0,28));}).join('|')+'&src=itinerary&coordinate=gaode&callnative=1';
      el.insertAdjacentHTML('afterend','<ul class="maplist">'+li+'</ul><div class="row-actions mapall"><a class="amap-btn" href="'+esc2(url)+'" target="_blank" rel="noreferrer">在高德地图查看当天 '+pts.length+' 个地点</a></div>');
    });
  }
  function fix(){build(); document.querySelectorAll('.daymini').forEach(function(e){if(e._m){e._m.invalidateSize(); e._m.fitBounds(e._b,{padding:[20,20],maxZoom:15});}});}
  document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){ if(t.dataset.tab==='sights') setTimeout(function(){fix();},120); });});
})();</script>
